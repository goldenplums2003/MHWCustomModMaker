; 往返测试（cfg_roundtrip）用的样例配置 —— 不是给人用的，别拿它当模板。
;
; 随包的 WeaponSoundEnhance.ini 里条目全是注释掉的示例，拿它跑往返测试等于
; 什么都没测（零条条目怎么存都"一致"）。这份把容易在存盘时丢掉的写法各放一条：
;   - 普通条目 / 刃时池 / 动作组
;   - 判定条目：Sound: 与 SoundEnd: 混用、CheckEndOn=time、Chat:
;   - 只发喊话不配音效的条件（曾经被当成空条件整条丢掉）
;   - 怪物条目 Target=monster
;   - StopOnEnd=1（关着的时候不写进 ini，所以开着的那条必须测）

[WeaponSoundEnhance]
Enabled=1
Volume=70
MaxWavMB=64

[Attack1]
Name=普通条目
WeaponType=3
FSMId=92
LMT=49265,49256
Sound=sounds/a.wav;sounds/b.wav|120|80|F

[Attack2]
Name=刃时池
WeaponType=3
FSMId=-1
LMT=49300
Sound:white=sounds/white.wav
Sound:red=sounds/red.wav|0|60

[Attack3]
Name=动作组
Group=登龙
WeaponType=3
FSMId=90
LMT=49326
StopOnEnd=1
Sound=sounds/dengslong.wav

[Attack4]
Name=登龙判定
WeaponType=3
FSMId=90
FSMTarget=5
LMT=49326
CheckTimeoutMs=2500
CheckEndOn=action
CheckOffsetMs=150
StopOnEnd=1
Sound:dmg>0=sounds/hit.wav
Sound=sounds/miss.wav

[Attack5]
Name=大居判定
WeaponType=3
LMT=49461,49462,49463
CheckDelayMs=200
CheckTimeoutMs=3000
CheckEndOn=time
CheckOffsetMs=150
Sound:dAura<0=sounds/fail.wav
SoundEnd:dmg>0 & dAura>=0=sounds/ok.wav
Chat:dmg>0 & dAura>=0=<STYL MOJI_YELLOW_DEFAULT>大居成功</STYL>
Sound=sounds/fail.wav
Chat=大居失败

[Attack6]
Name=只发喊话不配音效
Target=monster
MonsterName=黑龙
LMT=33029
CheckTimeoutMs=8000
CheckEndOn=time
Chat:dmg>0 & lmt==49326=<STYL MOJI_RED_DEFAULT>科目三成功</STYL>
